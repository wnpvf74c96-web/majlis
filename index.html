<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Majlis">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Majlis</title>
<link rel="stylesheet" href="./app.css?v=5">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="app">
<header>
  <div><h1>Majlis</h1><p>académie personnelle — économie, politique, philosophie, histoire</p></div>
  <div class="head-actions"><span id="apiState" class="badge bad">Gemini non configuré</span><button id="settingsBtn" class="ghost">⚙ Réglages</button></div>
</header>
<section class="panel intro">
  <div class="label">MODE D'ÉTUDE</div>
  <div id="modes" class="modes"></div>
  <div id="modeDesc" class="muted"></div>
</section>
<section class="panel composer" id="normalPanel">
  <div class="grid3">
    <input id="topic" placeholder="Sujet ou concept…">
    <select id="level"><option>Licence</option><option selected>M1</option><option>M2</option><option>Recherche</option></select>
    <select id="depth"><option>Dense</option><option selected>Avancé</option><option>Expert</option></select>
  </div>
  <textarea id="angle" placeholder="Angle, question précise ou contrainte (facultatif)…"></textarea>
  <div class="row"><span id="status" class="muted"></span><div><button id="launch" class="primary">Lancer</button><button id="stop" class="ghost" hidden>Stop</button></div></div>
</section>
<section class="panel" id="debatePanel" hidden>
  <input id="debateTopic" placeholder="Affirmation à débattre…">
  <div id="thread" class="thread"></div>
  <div id="debateReplyRow" class="row" hidden><input id="debateReply" placeholder="Ta réponse…"><button id="sendReply" class="primary">Envoyer</button></div>
  <div class="row"><button id="startDebate" class="primary">Ouvrir le débat</button><button id="verdict" class="ghost" hidden>Verdict /20</button></div>
</section>
<section class="folioWrap">
  <article id="folio" class="folio"><div class="empty"><b>Ton académie personnelle</b><span>Choisis un mode, écris un sujet et lance l'étude.</span></div></article>
  <div id="folioActions" class="actions" hidden>
    <button id="deeper" class="ghost">Approfondir</button><button id="challenge" class="ghost">Contredire</button><button id="quiz" class="ghost">Me tester</button><button id="save" class="ghost">Enregistrer</button><button id="speak" class="ghost">🔊 Écouter</button><button id="copy" class="ghost">Copier</button>
  </div>
</section>
<section class="panel history"><div class="row"><b>Historique</b><button id="clearHistory" class="ghost small">Effacer</button></div><div id="history"></div></section>
</div>
<div id="settings" class="overlay" hidden><div class="modal"><div class="row"><h2>Réglages</h2><button id="closeSettings" class="ghost">✕</button></div><label>Clé API Gemini</label><input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…"><p class="hint">Stockée uniquement dans Safari sur cet iPhone. Ne la partage pas.</p><label>Modèle</label><select id="model"><option value="gemini-3.8-flash" selected>Gemini 3.8 Flash — recommandé</option><option value="gemini-3.7-flash">Gemini 3.7 Flash</option><option value="gemini-3.6-flash">Gemini 3.6 Flash</option></select><label>Profil pédagogique</label><textarea id="profile" placeholder="Ex. je veux des cours très exigeants, avec exemples algériens…"></textarea><p id="settingsResult" class="settings-result"></p><div class="row"><button id="testApi" class="ghost">Tester Gemini</button><button id="saveSettings" class="primary">Enregistrer et fermer</button></div></div></div>
<script src="./model-upgrade.js?v=5"></script>
<script src="./prompts.js?v=5"></script>
<script src="./app.js?v=5"></script>
</body>
</html>
