name: Update Majlis Radar

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'radar-config.json'
      - 'scripts/build_radar.py'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

concurrency:
  group: majlis-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build radar feed
        run: python scripts/build_radar.py
      - name: Commit radar update
        run: |
          git config user.name "Majlis Radar"
          git config user.email "actions@users.noreply.github.com"
          git add radar.json
          if git diff --cached --quiet; then
            echo "No radar changes"
          else
            git commit -m "Actualiser la veille Majlis"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push concurrent, nouvel essai $i/3..."
              sleep $((i * 3))
            done
            exit 1
          fi
