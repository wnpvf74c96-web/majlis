name: Update Majlis Radar

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'radar-config.json'
      - 'scripts/build_radar.py'
      - '.github/workflows/radar.yml'

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build radar feed
        run: python scripts/build_radar.py
      - name: Commit radar update
        run: |
          git config user.name "Majlis Radar"
          git config user.email "actions@users.noreply.github.com"
          git add radar.json
          if git diff --cached --quiet; then
            echo "No radar changes"
          else
            git commit -m "Actualiser la veille Majlis"
            git push
          fi
